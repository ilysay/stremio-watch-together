# Checks on a GitHub macOS runner whether Stremio for Mac can be driven like on Windows:
# which web engine each version uses, and whether a remote debugging port can be opened.
name: macOS Stremio probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Stremio 5 (Apple Silicon)
        continue-on-error: true
        run: |
          set -x
          mkdir -p out && cd out
          curl -fL --retry 3 -o s5.dmg https://dl.strem.io/stremio-shell-macos/v5.1.26/Stremio_arm64.dmg
          hdiutil attach s5.dmg -nobrowse -noverify -mountpoint /Volumes/s5
          ls -la /Volumes/s5
          APP=$(ls -d /Volumes/s5/*.app | head -1)
          echo "APP=$APP"
          plutil -p "$APP/Contents/Info.plist" | head -60
          ls -la "$APP/Contents/MacOS" "$APP/Contents/Frameworks" || true
          for b in "$APP/Contents/MacOS/"*; do echo "== $b"; file "$b"; otool -L "$b" | head -60; done
          codesign -d --entitlements - "$APP" 2>&1 | head -40 || true
          MAIN="$APP/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")"
          strings -a "$MAIN" | grep -iE 'inspectable|remote-debugging|WKWebView|WebKit|QtWebEngine|QTWEBENGINE|CEF|chrom|tauri|wry|electron' | sort -u | head -80 || true
          # Lancement avec les variables de débogage connues
          QTWEBENGINE_REMOTE_DEBUGGING=127.0.0.1:9333 WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS=--remote-debugging-port=9333 "$MAIN" > s5-stdout.log 2>&1 &
          echo $! > s5.pid
          sleep 30
          lsof -nP -iTCP -sTCP:LISTEN | grep -iE 'stremio|9333|11470' || true
          curl -s --max-time 5 http://127.0.0.1:9333/json || echo "port 9333 ferme"
          screencapture -x s5.png || true
          kill $(cat s5.pid) || true; pkill -f stremio || true
          tail -40 s5-stdout.log || true

      - name: Stremio 4 (Qt, needs Rosetta)
        continue-on-error: true
        run: |
          set -x
          cd out
          softwareupdate --install-rosetta --agree-to-license || true
          curl -fL --retry 3 -o s4.dmg "https://www.strem.io/download?platform=mac&four=true" || curl -fL --retry 3 -o s4.dmg https://dl.strem.io/mac/v4.4.106/Stremio+4.4.106.dmg
          file s4.dmg
          hdiutil attach s4.dmg -nobrowse -noverify -mountpoint /Volumes/s4
          APP=$(ls -d /Volumes/s4/*.app | head -1)
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundle(ShortVersionString|Executable)'
          MAIN="$APP/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$APP/Contents/Info.plist")"
          file "$MAIN"
          QTWEBENGINE_REMOTE_DEBUGGING=127.0.0.1:9333 "$MAIN" > s4-stdout.log 2>&1 &
          echo $! > s4.pid
          sleep 40
          curl -s --max-time 5 http://127.0.0.1:9333/json || echo "port 9333 ferme"
          screencapture -x s4.png || true
          kill $(cat s4.pid) || true; pkill -f -i stremio || true
          tail -40 s4-stdout.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-probe
          path: out/*.png
